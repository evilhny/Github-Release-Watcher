
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (e.g. 0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Invalid version '$version'. Use a version such as 0.2 or 1.0.0."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore GitHubReleaseWatcher.csproj

      - name: Build application
        run: dotnet build GitHubReleaseWatcher.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows application
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: >-
          dotnet publish GitHubReleaseWatcher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output ./publish

      - name: Rename executable
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          Rename-Item "./publish/GitHubReleaseWatcher.exe" "GitHubWatcher-$env:RELEASE_VERSION.exe"

      - name: Create version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists. Choose a new version."
          }

          gh api "repos/${{ github.repository }}/git/refs" `
            -f "ref=refs/tags/$tag" `
            -f "sha=${{ github.sha }}"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GitHub Release Watcher v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ./publish/GitHubWatcher-*.exe
